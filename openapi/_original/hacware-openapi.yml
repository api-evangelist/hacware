      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_company_name:
                  type: string
                  description: The full company name for the company. (Optional)
                company_alias:
                  type: string
                  description: The company alias is the abbreviation and short version of the company
                    name. (Optional)
                ceo_name:
                  type: string
                  description: The ceo name is the CEO first name and last name or the company leadership.  This
                    will be used in phishing messages. (Required)
                ceo_email:
                  type: string
                  description: The ceo email is the CEO email address that will be used in phishing simulations.
                    (Required)
                security_officer:
                  type: string
                  description: The security leads first and last name. This will be used for phishing
                    and emails. (Required)
                sec_officer_email:
                  type: string
                  description: The security officer's email.  This will be used in phishing email and
                    training escalations. (Required)
                product_type:
                  type: string
                  description: The product type defines the type of product. The product type was Pro,
                    Plus, Super, and Basic. (Optional)
                send_reminders_and_esclations:
                  type: string
                  description: The send_reminders_and_esclations is a 'true'/'false' value for turning
                    on or off the training reminders.  The default value is 'true'. (Optional)
                sec_escalation_email:
                  type: string
                  description: The sec_escalation_email is the security training reminder contact. (Optional)
                mgt_escalation_email:
                  type: string
                  description: The mgt_escalation_email is the management training reminder contact. (Optional)
                phish_report_email:
                  type: string
                  description: The phish_report_email is the phishing report email contact. (Required)
                invites_enabled:
                  type: string
                  description: The invites_enabled is a 'true'/'false' value for turning on or off welcome
                    emails. The default value is 'true'. (Optional)
                lang:
                  type: string
                  description: lang is a string containing a two-letter ISO language code. The default
                    value is 'en'. (Optional)
                role_manager:
                  type: string
                  description: role_maanger is a string that determines how user roles or managed. It
                    can be either 'invite' (HacWare email invites) or 'ms' (Microsoft Entra ID). (Optional)
              required:
              - ceo_name
              - ceo_email
              - security_officer
              - sec_officer_email
              - phish_report_email
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
