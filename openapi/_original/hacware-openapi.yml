                  description: Phishing status update. Phishing status can be Active or Inactive (Required)
                department:
                  type: string
                  description: Phishing status update by department. To use department parameter, user
                    must be set to ALL. Department can be No Department or N/A for users that have no
                    department. (Optional)
              required:
              - user
              - phishing_status
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
          description: Unauthorized. Missing or invalid bearer token.
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer access token obtained from POST /api/v1/auth/ (exchange appid + secret key).
        Tokens expire ~1 hour after issue; use the refresh token to renew.
