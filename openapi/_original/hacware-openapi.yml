  /api/v1/user/reports/:
    get:
      operationId: GetUserReports
      summary: Search a Page of Users
      description: 'Get a page of users based on given filters. Tip: Best to use type=all along with any
        other filters to narrow down your search.'
      tags:
      - User
      parameters:
      - name: PageNum
        in: query
        schema:
          type: string
        description: Page Number. Defaults to page 1. (Required)
        required: true
      - name: user_email
        in: query
        schema:
          type: string
        description: User's Email required for type=single. Used just to get one specific user. (Optional)
      - name: keyword
        in: query
        schema:
          type: string
        description: Keyword to filter the search by user's name or email. Can be used with either type=all,
          type=in_active, type=active to further filter users. (Optional)
      - name: type
        in: query
        schema:
          type: string
        description: Type of Report. Can be [all, active, in_active, single]. If type=single, requires
          user_email parameter. This parameter is required if using other filters. (Optional)
      - name: phish_start
        in: query
        schema:
          type: string
        description: Filter users by their next scheduled phishing simulation starting at this date. Can
          be used with all types except type=single. Requires a type parameter. (Users without scheduled
          phishing simulations will be excluded) - mm/dd/yyyy (Optional)
      - name: phish_end
        in: query
        schema:
          type: string
        description: Filter users by their next scheduled phishing simulation ending at this date. Can
          be used with all types except type=single. Requires a type parameter. (Users without scheduled
          phishing simulations will be excluded)- mm/dd/yyyy (Optional)
      - name: last_sim_passed
        in: query
        schema:
          type: boolean
        description: Filter users by their most recent phishing simulation. It will return users that
          have either passed (True) or failed (False) their recent simulation. Requires a type parameter.
          (Users without phsing simulations will default to passed.) (Optional)
      - name: department
        in: query
        schema:
          type: string
        description: Filter users by their department given by Outlook and Gmail group sync. Will not
          work for Open email types. Requires a type parameter. (Optional)
      - name: PageSize
        in: query
        schema:
          type: string
        description: Number of results to return. Defaults to 50 users per page. (Optional)
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
          description: Unauthorized. Missing or invalid bearer token.
      security:
      - bearerAuth: []
