      security:
      - bearerAuth: []
  /api/v1/train/course_list_rec/:
    get:
      operationId: GetCourseRecList
      summary: Get Course Recommendation List
      description: Return of a list of the course recommendations/templates. Can be filtered.
      tags:
      - Training
      parameters:
      - name: course_type
        in: query
        schema:
          type: string
        description: Course Type. (Optional)
      - name: search
        in: query
        schema:
          type: string
        description: Keywords to filter course recommendations. (Optional)
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
          description: Unauthorized. Missing or invalid bearer token.
      security:
      - bearerAuth: []
  /api/v1/train/lesson_list/:
    get:
      operationId: GetLessonPlanList
      summary: Get Lesson Plan List
      description: Creates a new lesson plan.
      tags:
      - Training
      parameters:
      - name: LessonPlanName
        in: query
        schema:
          type: string
        description: Lesson plan name. (Optional)
      - name: LessonPlanID
        in: query
        schema:
          type: string
        description: Lesson plan ID. (Optional)
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
