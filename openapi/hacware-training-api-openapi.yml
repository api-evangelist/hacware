openapi: 3.0.3
info:
  title: Security Awareness API Documentation Admin Training API
  description: This API documentation explains how to build your own AI powered security awareness and training application. HacWare is an AI-powered security awareness training and phishing simulation platform. This OpenAPI was derived by API Evangelist from HacWare's published apiDoc documentation.
  version: 1.0.4
  contact:
    name: HacWare
    email: hello@hacware.com
    url: https://hacware.com/dev.html
  termsOfService: https://hacware.com/terms-of-service
servers:
- url: https://{domain}
  description: Per-tenant HacWare API host; {domain} is the subdomain assigned to your company at onboarding.
  variables:
    domain:
      default: app.hacware.com
tags:
- name: Training
paths:
  /api/v1/train/add_course_member/:
    post:
      operationId: AddCourseMember
      summary: Enroll User to Course
      description: Adds a user to a specified course. Blank date will send the course instantly.
      tags:
      - Training
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: User's email. (Required)
                courseID:
                  type: string
                  description: Course ID. (Required)
                trainDate:
                  type: string
                  description: Date of the training. - MM/DD/YYYY HH:MM AM/PM (Optional)
              required:
              - email
              - courseID
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
          description: Unauthorized. Missing or invalid bearer token.
      security:
      - bearerAuth: []
  /api/v1/train/courselist/:
    get:
      operationId: GetCourseList
      summary: Get Course List
      description: Return a list of all the courses or a specific courses in the account.
      tags:
      - Training
      parameters:
      - name: course_type
        in: query
        schema:
          type: string
        description: Course Type. (Optional)
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
          description: Unauthorized. Missing or invalid bearer token.
      security:
      - bearerAuth: []
  /api/v1/train/getquiz/:
    get:
      operationId: GetCourseQuiz
      summary: Get Course
      description: Returns courses based on given id or courses that the given user is in.
      tags:
      - Training
      parameters:
      - name: training_id
        in: query
        schema:
          type: string
        description: Course ID. (Optional)
      - name: training_em
        in: query
        schema:
          type: string
        description: User Email. (Optional)
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
          description: Unauthorized. Missing or invalid bearer token.
      security:
      - bearerAuth: []
  /api/v1/train/coursequizlist/:
    get:
      operationId: GetCourseQuizList
      summary: Get All Recommendations
      description: Returns a list of all course and quizzes recommendations/templates. Can be filtered.
      tags:
      - Training
      parameters:
      - name: course_type
        in: query
        schema:
          type: string
        description: Course Type. (Optional)
      - name: quiz_topic
        in: query
        schema:
          type: string
        description: Quiz Topic. (Optional)
      - name: search
        in: query
        schema:
          type: string
        description: Keywords to filter course and quiz recommendations. (Optional)
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request. The error message describes the problem.
        '401':
          description: Unauthorized. Missing or invalid bearer token.
      security:
      - bearerAuth: []
  /api/v1/train/course_list/:
    get:
      operationId: GetCourseRecList
      summary: Get Course Recommendation List
      description: Return of a list of the course recommendations. Can be filtered.
      tags:
