aid: hacware
name: Hacware
description: >-
  HacWare is an AI-powered security awareness training and phishing simulation platform that helps
  organizations reduce human-factor cyber risk. Its RESTful Security Awareness API lets partners and
  developers embed HacWare into their own products: schedule and manage AI-generated phishing
  simulations (clickable link, attachment, direct response, and SMS), enroll users in micro-training
  courses, lesson plans and quizzes, run dark web breach reporting and human-risk assessments,
  manage users, groups and Microsoft 365 security groups, and operate a multi-tenant partner/customer
  hierarchy with compliance evidence retrieval. The API is documented with apiDoc and exposes 114
  operations across Phishing, Training, Reporting, User, Group, Compliance, and Multi-Tenant surfaces.
  HacWare is a Techstars portfolio company.
